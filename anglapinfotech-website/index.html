<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AnglapInfotech is an AI-ingrained business consultancy, and advisory company that monetizes AI to create strategies that make economic sense." />
    <title>AnglapInfotech | Home | AI-Ingrained Business Consulting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <script>
      (function() {
        const preference = localStorage.getItem('theme_preference');
        if (preference) {
          document.documentElement.setAttribute('data-theme', preference);
        } else {
          const hour = new Date().getHours();
          const isNight = hour >= 19 || hour < 7;
          document.documentElement.setAttribute('data-theme', isNight ? 'dark' : 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
